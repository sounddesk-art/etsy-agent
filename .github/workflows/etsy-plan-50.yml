name: Check researched Etsy 50 plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Build ephemeral current draft inventory
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: PYTHONPATH=scripts python scripts/inventory_etsy_drafts.py
      - name: Build plan without publishing or deleting
        run: python scripts/plan_etsy_50.py
      - name: Print redacted plan counts only
        run: |
          python - <<'PY'
          import json
          x=json.load(open("data/etsy_50_selection_plan.json"))
          assert x["target_slots"]==50
          assert x["rules"]["publishing"]=="disabled"
          assert x["rules"]["deletion"]=="disabled"
          print({
            "target":x["target_slots"],
            "existing_research_matched":x["existing_research_matched_slots"],
            "new_research_slots":x["new_research_slots"],
            "hold_existing_drafts":x["existing_drafts_hold_only_no_delete"],
            "etsy_mutations":0,
          })
          PY
      - name: Remove ephemeral unpublished inventory and plan
        if: always()
        run: rm -f data/etsy_draft_inventory.json data/etsy_50_selection_plan.json
