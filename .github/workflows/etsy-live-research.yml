name: Etsy live research - max 50 candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_etsy_50.py"
      - "scripts/test_research_etsy_50.py"
      - ".github/workflows/etsy-live-research.yml"

permissions:
  contents: write

concurrency:
  group: etsy-live-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Unit tests
        run: python -m unittest scripts/test_research_etsy_50.py -v
      - name: Research current Etsy niches and prepare max 50 candidate briefs
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: python scripts/research_etsy_50.py
      - name: Save research snapshots
        run: |
          git config user.name "sounddesk-etsy-research"
          git config user.email "actions@users.noreply.github.com"
          git add data/etsy_market_research.json data/researched_listing_candidates.json
          if git diff --cached --quiet; then
            echo "Research unchanged."
            exit 0
          fi
          git commit -m "data: refresh Etsy live research"
          git pull --rebase origin main
          git push origin HEAD:main
