name: Repurpose approved art and create Etsy drafts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Test mandatory per-design human review gate
        run: python -m unittest discover -s scripts -p "test_review_gate.py" -v
      - name: Repurpose reviewed images only
        run: python scripts/repurpose_products.py
      - name: Create Etsy drafts only for reviewed products
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python scripts/upload_repurposed_drafts.py
