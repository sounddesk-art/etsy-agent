name: Etsy read-only draft inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/inventory_etsy_drafts.py"
      - ".github/workflows/etsy-draft-inventory.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Read current Etsy drafts only
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: PYTHONPATH=scripts python scripts/inventory_etsy_drafts.py
      - name: Save read-only inventory snapshot
        run: |
          git config user.name "sounddesk-etsy-inventory"
          git config user.email "actions@users.noreply.github.com"
          git add data/etsy_draft_inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: snapshot Etsy draft inventory"
          git pull --rebase origin main
          git push origin HEAD:main
