name: Etsy read-only draft inventory check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Read current Etsy draft count only
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=scripts python scripts/inventory_etsy_drafts.py
          python - <<'PY'
          import json
          x=json.load(open("data/etsy_draft_inventory.json"))
          print({"draft_count":x["draft_count"],"read_only":x["read_only"]})
          PY
      - name: Remove ephemeral unpublished inventory
        if: always()
        run: rm -f data/etsy_draft_inventory.json
