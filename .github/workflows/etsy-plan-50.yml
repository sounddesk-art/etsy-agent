name: Plan researched Etsy 50

on:
  push:
    branches: [main]
    paths:
      - "data/etsy_draft_inventory.json"
      - "data/etsy_market_research.json"
      - "data/researched_listing_candidates.json"
      - "scripts/plan_etsy_50.py"
      - ".github/workflows/etsy-plan-50.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build exactly 50 evidence-based target slots
        run: python scripts/plan_etsy_50.py
      - name: Verify plan makes no Etsy mutation
        run: |
          python - <<'PY'
          import json
          x=json.load(open("data/etsy_50_selection_plan.json"))
          assert x["target_slots"]==50
          assert x["existing_research_matched_slots"]+x["new_research_slots"]==50
          assert x["rules"]["publishing"]=="disabled"
          assert x["rules"]["deletion"]=="disabled"
          print(x["existing_research_matched_slots"],x["new_research_slots"],x["existing_drafts_hold_only_no_delete"])
          PY
      - name: Save selection plan
        run: |
          git config user.name "sounddesk-etsy-planner"
          git config user.email "actions@users.noreply.github.com"
          git add data/etsy_50_selection_plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh evidence-based Etsy 50 plan"
          git pull --rebase origin main
          git push origin HEAD:main
