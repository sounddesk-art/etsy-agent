name: Update existing Etsy draft metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/update_existing_drafts_token.txt"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Update and verify six existing Etsy drafts
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python scripts/update_existing_draft_metadata.py
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etsy-draft-metadata-update-${{ github.run_id }}
          path: output/update_existing_drafts_result.json
          if-no-files-found: warn
          retention-days: 30